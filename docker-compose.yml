# Local MongoDB for testing NumanOS (mirrors MongoDB Atlas in production).
#   docker compose up -d            # start MongoDB (+ web UI)
#   docker compose down             # stop
#   docker compose down -v          # stop and wipe the data volume
#
# Then point the backend at it via backend/.env:
#   MONGODB_URI=mongodb://localhost:27017
#   MONGODB_DB=numanos

services:
  mongo:
    image: mongo:7
    container_name: numanos-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional web UI to browse the data at http://localhost:8081
  mongo-express:
    image: mongo-express:1.0.2
    container_name: numanos-mongo-ui
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"

volumes:
  mongo_data:
